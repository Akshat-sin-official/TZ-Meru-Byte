services:
  db:
    image: mysql:8.0
    container_name: cit_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cit_campus_os
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - cit_net

  pg_whatsapp:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: evogo_auth
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - cit_net

  optimizer:
    build:
      context: ./optimizer
      dockerfile: Dockerfile
    container_name: cit_optimizer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    networks:
      - cit_net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cit_server
    restart: unless-stopped
    depends_on:
      - db
      - optimizer
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
      DATABASE_URL: "mysql://root:root@db:3306/cit_campus_os"
      OPTIMIZER_URL: "http://optimizer:8001"
      NODE_ENV: production
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - cit_net

  caddy:
    image: caddy:alpine
    container_name: cit_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./client/dist:/var/www/cit:ro
      - /opt/evolution-whatsapp:/var/www/whatsapp:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - cit_net

volumes:
  mysql_data:
  pg_data:
  caddy_data:
  caddy_config:

networks:
  cit_net:
    driver: bridge

